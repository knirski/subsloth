name: KMP Build

on: [push, pull_request]

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA17_HOME: ""
  SUBSLOTH_LOGIN: ""
  SUBSLOTH_PASSWORD: ""

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JDK 25 runs the Gradle daemon (Metro DI requires ≥21).
      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # JDK 17 is the Kotlin/Java compile toolchain.
      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run KMP checks
        run: ./gradlew spotlessCheck detekt :core:model:compileKotlinJvm :core:domain:compileKotlinJvm :app:assembleDebug test
