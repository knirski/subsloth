name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Path filtering ──────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'gradlew'
              - 'gradlew.bat'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              - 'config/**'
              - 'gradle/**'
              - 'api/**'
              - '.github/**'

  # ─── Pre-checks (fast, gated by path filter) ───────────────────────────
  pre-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.26.5/vacuum_0.26.5_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      - uses: ./.github/actions/kmp-setup

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Invariant checks
        run: .github/scripts/check-invariants.sh

  # ─── Platform build matrix ─────────────────────────────────────────────
  # Each platform target runs in parallel with its required OS runner.
  # Fail-fast is disabled so one platform failure doesn't cancel others.
  build:
    name: ${{ matrix.display }}
    needs: pre-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: 🟢 Android
            os: ubuntu-latest
            tasks: lintDebug testDebugUnitTest assembleDebug

          # jvmTest runs on all KMP modules. There's no aggregating root
          # `test` task for KMP — modules use subsloth.kmp.library
          # convention which doesn't apply java-base.
          # When adding a new KMP module, add its :module:jvmTest here.
          - display: ☕ JVM / KMP
            os: ubuntu-latest
            tasks: >
              :core:model:jvmTest :core:domain:jvmTest
              :core:network:jvmTest :core:database:jvmTest
              :core:preferences:jvmTest :core:ui:jvmTest
              :feature:auth:jvmTest :feature:catalog:jvmTest
              :feature:details:jvmTest :feature:player:jvmTest
              :feature:library:jvmTest :feature:settings:jvmTest
              :core:media:jvmTest

          - display: 🖥️ Desktop / Linux
            os: ubuntu-latest
            tasks: :desktopApp:compileKotlin

          - display: 🌐 Web / wasmJs
            os: ubuntu-latest
            tasks: :webApp:compileKotlinWasmJs

          # - display: 📱 iOS / Simulator
          #   os: macos-latest
          #   tasks: >
          #     :core:model:iosSimulatorArm64Test
          #     :core:domain:iosSimulatorArm64Test
          #     :core:ui:compileKotlinIosArm64

          # - display: 🍏 macOS / Native
          #   os: macos-latest
          #   tasks: >
          #     :core:model:compileKotlinMacosArm64
          #     :core:domain:compileKotlinMacosArm64
          #     :core:ui:compileKotlinMacosArm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - name: Gradle ${{ matrix.display }}
        run: ./gradlew ${{ matrix.tasks }}
