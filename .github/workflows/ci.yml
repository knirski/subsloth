name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              - 'config/**'
              - 'gradle/**'
              - 'api/**'
              - '.github/**'
              - '.github/scripts/**'

  # ─── Fast pre-checks ──────────────────────────────────────────────────────
  pre-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.26.5/vacuum_0.26.5_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      - uses: ./.github/actions/kmp-setup

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Run invariant checks
        run: .github/scripts/check-invariants.sh

  # ─── Shared JVM tests (KMP jvmTest + Android test) ───────────────────────
  test:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kmp-setup

      - name: Compile KMP JVM targets
        run: ./gradlew :core:model:compileKotlinJvm :core:domain:compileKotlinJvm :core:ui:compileKotlinJvm :feature:auth:compileKotlinJvm :feature:catalog:compileKotlinJvm :feature:details:compileKotlinJvm :feature:player:compileKotlinJvm

      - name: Run all JVM tests
        run: ./gradlew test

  # ─── KMP Native (iOS + macOS) ───────────────────────────────────────────
  kmp-native:
    needs: pre-checks
    if: success()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kmp-setup

      - name: Compile iOS ARM64
        run: ./gradlew :core:model:compileKotlinIosArm64 :core:domain:compileKotlinIosArm64 :core:ui:compileKotlinIosArm64

      - name: Compile macOS ARM64
        run: ./gradlew :core:model:compileKotlinMacosArm64 :core:domain:compileKotlinMacosArm64 :core:ui:compileKotlinMacosArm64

  # ─── Static analysis ─────────────────────────────────────────────────────
  lint:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew lintDebug

  detekt:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew detekt
