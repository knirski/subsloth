name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA17_HOME: ""
  SUBSLOTH_LOGIN: ""
  SUBSLOTH_PASSWORD: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      androidTest: ${{ steps.filter.outputs.androidTest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              - 'config/**'
              - 'gradle/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pr-agent.yml'
              - '.github/scripts/**'
            androidTest:
              - '**/src/androidTest/**'

  # ------------------------------------------------------------------
  # Fast pre-checks — no compilation, ~30s
  # ------------------------------------------------------------------
  pre-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.26.5/vacuum_0.26.5_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Run invariant checks
        run: .github/scripts/check-invariants.sh

  # ------------------------------------------------------------------
  # KMP JVM — compiles all KMP modules for JVM + runs unit tests
  # Runs on ubuntu (fastest runner).
  # ------------------------------------------------------------------
  test:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Compile KMP JVM targets
        run: >
          ./gradlew :core:model:compileKotlinJvm
                    :core:domain:compileKotlinJvm
                    :core:ui:compileKotlinJvm
                    :feature:auth:compileKotlinJvm
                    :feature:catalog:compileKotlinJvm
                    :feature:details:compileKotlinJvm
                    :feature:player:compileKotlinJvm

      - name: Run all JVM tests (KMP + Android)
        run: ./gradlew test

  # ------------------------------------------------------------------
  # KMP Native — compiles KMP modules for iOS + macOS targets
  # Runs on macOS (required for iOS toolchain).
  # ------------------------------------------------------------------
  kmp-native:
    needs: pre-checks
    if: success()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      # Compile iOS ARM64 — validates iOS native target compilation
      - name: Compile iOS ARM64 targets
        run: >
          ./gradlew :core:model:compileKotlinIosArm64
                    :core:domain:compileKotlinIosArm64
                    :core:ui:compileKotlinIosArm64

      # Compile macOS ARM64 — validates desktop native target compilation
      - name: Compile macOS ARM64 targets
        run: >
          ./gradlew :core:model:compileKotlinMacosArm64
                    :core:domain:compileKotlinMacosArm64
                    :core:ui:compileKotlinMacosArm64

  # ------------------------------------------------------------------
  # Static analysis — Android lint + detekt
  # ------------------------------------------------------------------
  lint:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run Android lint
        run: ./gradlew lintDebug

  detekt:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run detekt
        run: ./gradlew detekt

  # ------------------------------------------------------------------
  # Instrumented tests — Android emulator (requires KVM)
  # Only runs when androidTest source sets are present (currently none).
  # ------------------------------------------------------------------
  instrumented-test:
    needs: [changes, pre-checks]
    if: needs.changes.outputs.androidTest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Check for androidTest directories
        id: check
        run: |
          dirs=$(find . -type d -name androidTest -path '*/src/androidTest' 2>/dev/null)
          if [ -n "$dirs" ]; then
            echo "has_android_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android_test=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM
        if: steps.check.outputs.has_android_test == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger || true
          sudo chmod 666 /dev/kvm

      - name: Run instrumented tests
        if: steps.check.outputs.has_android_test == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: subsloth-ci
          force-avd-creation: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          script: ./gradlew :core:preferences:connectedDebugAndroidTest
