name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Path filtering ──────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      shared: ${{ steps.filter.outputs.shared }}
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'gradlew'
              - 'gradlew.bat'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              - '**/*.json'
              - '**/*.md'
              - 'gradle.properties'
              - 'docs/**'
              - 'config/**'
              - 'gradle/**'
              - 'api/**'
              - '.github/**'
              - 'build-logic/**'
            shared:
              - 'core/**'
              - 'feature/**'
              - 'testing/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            android:
              - 'androidApp/**'
            desktop:
              - 'desktopApp/**'
            web:
              - 'webApp/**'

  # ─── Pre-checks (fast, gated by path filter) ───────────────────────────
  pre-checks:
    needs: changes
    if: |
      needs.changes.outputs.source == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.26.5/vacuum_0.26.5_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      - uses: ./.github/actions/kmp-setup

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Invariant checks
        run: .github/scripts/check-invariants.sh

  # ─── Platform builds ──────────────────────────────────────────────────
  # Each platform runs as a separate job with path-conditional execution.
  # Jobs are independent (no fail-fast) so one failure doesn't cancel others.
  # Shared code (core/, feature/, testing/, build-logic/, gradle/) triggers
  # all platforms. App-only changes only trigger their own platform.
  #
  # KMP modules use target-specific test tasks (jvmTest, wasmJsTest, etc.)
  # rather than a generic `test` task, because the Kotlin Multiplatform
  # plugin intentionally doesn't apply java-base/java-library.

  build-android:
    name: 🟢 Android
    needs: [changes, pre-checks]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug

  # JVM tests across all KMP modules. KMP doesn't create a generic `test`
  # task — it creates target-specific tasks (jvmTest, wasmJsTest, etc.)
  # instead, because each target has its own test runner. The `test` task
  # comes from java-base/java-library, which KMP deliberately doesn't apply.
  build-jvm:
    name: ☕ JVM / KMP
    needs: [changes, pre-checks]
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew jvmTest

  build-desktop:
    name: 🖥️ Desktop / Linux
    needs: [changes, pre-checks]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew :desktopApp:compileKotlin

  build-web:
    name: 🌐 Web / wasmJs
    needs: [changes, pre-checks]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew :webApp:compileKotlinWasmJs
