name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

# Cancel redundant runs when pushing new commits to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No Media credentials, no live Media calls, no signing keys.
# This workflow is purely offline and deterministic.
permissions:
  contents: read

env:
  # Gradle daemon runs on JDK 25 (see docs/jdk.md).
  # The compile toolchain uses JDK 17 discovered via JAVA17_HOME.
  JAVA17_HOME: ""
  SUBSLOTH_LOGIN: ""
  SUBSLOTH_PASSWORD: ""

jobs:
  # Detect which paths changed so heavy jobs only run when source code is
  # affected.  Docs/config-only PRs skip the compile/test suite.
  #
  # Filter by file extension, not by module directory, so new source
  # modules (e.g. :core:sync) automatically trigger CI without updating
  # this list.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      androidTest: ${{ steps.filter.outputs.androidTest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              # Source code — any module, any depth.
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              # Static analysis config.
              - 'config/**'
              # Build system.
              - 'gradle/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pr-agent.yml'
              - '.github/scripts/**'

            androidTest:
              # Instrumented test source files — any module that has them.
              - '**/src/androidTest/**'
              # Production source / build config in modules that have
              # instrumented tests.
              # (Currently no module has androidTest source sets.)

  # ------------------------------------------------------------------
  # Fast pre-checks — no compilation needed.
  # OpenAPI validation, code formatting, and invariant/hygiene checks.
  # These fail within ~30s, before the expensive jobs even start.
  # ------------------------------------------------------------------
  pre-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- OpenAPI validation (fast pre-check) ----
      # Runs before JDK/Gradle setup so an invalid spec fails immediately
      # (~100ms with vacuum vs ~30s of Gradle infrastructure).
      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.26.5/vacuum_0.26.5_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      # ---- JDK setup ----
      # JDK 25 runs the Gradle daemon (Metro requires ≥21).
      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # JDK 17 is the Kotlin/Java compile toolchain.
      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      # ---- Gradle setup (caching, wrapper validation) ----
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      # ---- Code formatting check ----
      # Fails immediately on formatting violations without waiting for
      # compilation.
      - name: Check code formatting
        run: ./gradlew spotlessCheck

      # ---- Invariant checks ----
      - name: Run invariant checks
        run: .github/scripts/check-invariants.sh

  # ------------------------------------------------------------------
  # Heavy checks — run in parallel across separate runners to minimize
  # wall-clock time.  Each job shares cached Gradle dependencies and
  # build-cache outputs via the gradle/actions/setup-gradle action.
  # ------------------------------------------------------------------
  lint:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run lint
        run: ./gradlew lintDebug

  test:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  detekt:
    needs: pre-checks
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run detekt
        run: ./gradlew detekt

  # Instrumented (Android Keystore) tests — run on a KVM-accelerated
  # x86_64 emulator via reactivecircus/android-emulator-runner.
  # Only triggered when modules with androidTest source sets are
  # affected (output from the `changes` job).
  # Currently no modules have androidTest — this job is retained
  # as a template for when instrumented tests are added.
  instrumented-test:
    needs: [changes, pre-checks]
    if: needs.changes.outputs.androidTest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 17 (compile toolchain)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set environment JDK variables
        run: |
          echo "JAVA_HOME=${{ steps.jdk25.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Check for androidTest directories
        id: check
        run: |
          dirs=$(find . -type d -name androidTest -path '*/src/androidTest' 2>/dev/null)
          if [ -n "$dirs" ]; then
            echo "has_android_test=true" >> "$GITHUB_OUTPUT"
            echo "Found androidTest directories: $dirs"
          else
            echo "has_android_test=false" >> "$GITHUB_OUTPUT"
            echo "No androidTest directories found, skipping instrumented tests."
          fi

      # KVM is available on standard GitHub Actions ubuntu runners but
      # /dev/kvm permissions must be set before the emulator starts.
      # The chmod makes /dev/kvm immediately accessible; the udev rule
      # ensures persistence if the node is recreated.
      - name: Enable KVM
        if: steps.check.outputs.has_android_test == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run instrumented tests
        if: steps.check.outputs.has_android_test == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          avd-name: subsloth-ci
          force-avd-creation: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          script: ./gradlew :core:preferences:connectedDebugAndroidTest
