name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Path filtering ──────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      shared: ${{ steps.filter.outputs.shared }}
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'gradlew'
              - 'gradlew.bat'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.xml'
              - '**/*.pro'
              - '**/*.json'
              - '**/*.md'
              - 'gradle.properties'
              - 'docs/**'
              - 'config/**'
              - 'gradle/**'
              - 'api/**'
              - '.github/**'
              - 'build-logic/**'
            shared:
              - 'core/**'
              - 'feature/**'
              - 'testing/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            android:
              - 'androidApp/**'
            desktop:
              - 'desktopApp/**'
            web:
              - 'webApp/**'

  # ─── Pre-checks (fast, gated by path filter) ───────────────────────────
  pre-checks:
    needs: changes
    if: |
      needs.changes.outputs.source == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate OpenAPI spec
        run: |
          curl -fsSL https://github.com/daveshanley/vacuum/releases/download/v0.29.9/vacuum_0.29.9_linux_x86_64.tar.gz \
            -o /tmp/vacuum.tar.gz
          tar xzf /tmp/vacuum.tar.gz -C /usr/local/bin vacuum
          vacuum lint api/subsloth.openapi.yaml --ruleset config/vacuum.yaml --fail-severity error

      - uses: ./.github/actions/kmp-setup

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Architecture dependency-graph invariants
        run: ./gradlew :testing:architecture-rules:test

      - name: Invariant checks
        run: .github/scripts/check-invariants.sh

  # ─── Platform builds ──────────────────────────────────────────────────
  # Each platform runs as a separate job with path-conditional execution.
  # Jobs are independent (no fail-fast) so one failure doesn't cancel others.
  # Shared code (core/, feature/, testing/, build-logic/, gradle/) triggers
  # all platforms. App-only changes only trigger their own platform.
  #
  # Platform jobs gate on `changes` only — NOT on `pre-checks` — so they
  # start as soon as the path filter resolves, overlapping with formatting,
  # detekt, and invariant checks (saves ~2-3 min wall-clock per run).
  # If pre-checks fail the workflow still shows red; the overlapping
  # compilation is wasted only on those rare pre-check failures.
  #
  # build-jvm-and-desktop runs both JVM tests and desktop compilation in a
  # single Gradle daemon.  When shared code changes, jvmTest compiles all
  # KMP JVM targets first, then :desktopApp:compileKotlin reuses the warm
  # daemon and build cache — no duplicated compilation.  When only desktop
  # files change, the JVM test step is skipped and only the desktop app
  # compiles.
  #
  # build-android and build-web use different KMP targets (Android/WasmJs)
  # so they run in parallel with build-jvm-and-desktop. Their compilation
  # outputs are not shared via this mechanism.
  #
  # KMP modules use target-specific test tasks (jvmTest, wasmJsTest, etc.)
  # rather than a generic `test` task, because the Kotlin Multiplatform
  # plugin intentionally doesn't apply java-base/java-library.

  build-android:
    name: 🟢 Android
    needs: [changes]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug

  # JVM tests + Desktop compilation — merged into one job so Gradle's own
  # build cache and daemon are shared naturally between the two Gradle
  # invocations.  When shared code changes, jvmTest compiles all KMP JVM
  # targets; then :desktopApp:compileKotlin skips already-compiled modules.
  # When only desktop files change, jvmTest is skipped (step-level if).
  build-jvm-and-desktop:
    name: ☕ JVM / 🖥️ Desktop
    needs: [changes]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kmp-setup

      - name: JVM tests (shared code)
        if: needs.changes.outputs.shared == 'true'
        run: ./gradlew jvmTest

      - name: Desktop compilation
        run: ./gradlew :desktopApp:compileKotlin

  build-web:
    name: 🌐 Web / wasmJs
    needs: [changes]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: kmp-setup
        uses: ./.github/actions/kmp-setup

      - name: Install browser OS dependencies
        run: npx --yes playwright@${{ steps.kmp-setup.outputs.playwright-version }} install-deps chromium firefox

      - name: Install Chromium and Firefox for WasmJS browser tests
        if: steps.kmp-setup.outputs.playwright-cache-hit != 'true'
        run: npx --yes playwright@${{ steps.kmp-setup.outputs.playwright-version }} install chromium firefox

      - name: Select browsers for Karma
        run: |
          CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x -print -quit)
          FIREFOX_BIN=$(find "$HOME/.cache/ms-playwright" -type f -name firefox -perm -u+x -print -quit)
          test -n "$CHROME_BIN"
          test -n "$FIREFOX_BIN"
          chmod +x .github/scripts/karma-chrome .github/scripts/karma-firefox
          {
            echo "KARMA_CHROME_REAL_BIN=$CHROME_BIN"
            echo "KARMA_FIREFOX_REAL_BIN=$FIREFOX_BIN"
            echo "CHROME_BIN=$GITHUB_WORKSPACE/.github/scripts/karma-chrome"
            echo "FIREFOX_BIN=$GITHUB_WORKSPACE/.github/scripts/karma-firefox"
          } >> "$GITHUB_ENV"

      - run: ./gradlew :webApp:compileKotlinWasmJs

      - name: WasmJS browser tests
        run: ./gradlew :webApp:wasmJsBrowserTest

  # ─── Android instrumented tests (emulator) ──────────────────────────
  # Runs :core:database and :core:preferences device checks and :androidApp
  # UI instrumented tests on a single emulator to minimise boot overhead.
  # Path-gated the same as build-android (shared or android changes).
  #
  # Runs in parallel with build-android — the Gradle setup action uses
  # cache-read-only on PR branches so serialisation would not save
  # compilation time there.  AVD system-image cache (below) is the main
  # saving across all branches.
  instrumented-android-tests:
    name: 📱 Instrumented
    needs: [changes]
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/kmp-setup

      # Cache Android virtual device and system images so they don't have
      # to be re-downloaded + re-created on every run (~1-2 min saving).
      # The emulator runner stores AVDs in ~/.android/avd/ and system
      # images in ~/.android/system-images/ after first setup.
      - name: Cache AVD and system images
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/
            ~/.android/system-images/
          key: ${{ runner.os }}-avd-${{ runner.arch }}-api36-google-apis
          restore-keys: |
            ${{ runner.os }}-avd-${{ runner.arch }}-

      - uses: ./.github/actions/kvm-setup

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 6144
          heap-size: 1024
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -cache-size 512
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew -Dorg.gradle.jvmargs="-Xmx3g" -Pkotlin.daemon.jvmargs="-Xmx1g" :core:database:connectedAndroidDeviceTest :core:preferences:connectedAndroidDeviceTest :androidApp:connectedDebugAndroidTest
