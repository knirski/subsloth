name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Releases must not race each other: queue instead of cancelling so every
# main push that carries releasable commits gets its own release.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  # Compute the next version without publishing anything. Building and
  # verifying happen before the release exists, so a failed build cannot
  # leave a published release with missing assets.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/kmp-setup

      - name: Compute the next release (dry run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.display }}
    needs: prepare
    if: needs.prepare.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: 🟢 Android / APK
            type: android
            os: ubuntu-latest
            tasks: :androidApp:assembleRelease
            artifactPath: androidApp/build/outputs/apk/release/*.apk

          - display: 🖥️ Desktop / Linux
            type: desktop
            os: ubuntu-latest
            tasks: :desktopApp:packageDistributionForCurrentOS
            artifactPath: desktopApp/build/compose/binaries/main/deb/*.deb

          - display: 🌐 Web / wasmJs
            type: web
            os: ubuntu-latest
            tasks: :webApp:wasmJsBrowserDistribution
            artifactPath: webApp/build/dist/wasmJs/productionExecutable/**

          # macOS/iOS targets require macos-latest runner.
          # Uncomment when a macOS CI runner is configured:
          #
          # - display: 📱 iOS / Simulator Test
          #   type: ios
          #   os: macos-latest
          #   tasks: :core:model:iosSimulatorArm64Test
          #
          # - display: 🍏 macOS / Native Compile
          #   type: native
          #   os: macos-latest
          #   tasks: :core:model:compileKotlinMacosArm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/kmp-setup

      - name: Ensure Android release-APK signing
        if: matrix.type == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
              echo "HAS_RELEASE_KEYSTORE=true"
            } >> "$GITHUB_ENV"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            # No release keystore configured: generate the standard debug
            # keystore so the release APK is signed and installable.
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build (${{ matrix.display }})
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew ${{ matrix.tasks }} ${RELEASE_VERSION:+-PsubslothVersion=$RELEASE_VERSION}

      # A missing or corrupt ANDROID_KEYSTORE_* secret silently falls back to
      # an ephemeral debug keystore, which produces an APK that cannot be
      # installed over previous releases. Fail the release instead, pinning the
      # expected signing certificate in .github/release-signing-sha256.txt.
      - name: Verify release APK signing certificate
        if: matrix.type == 'android' && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::Android release APK not found"
            exit 1
          fi
          apksigner_bin=$(command -v apksigner || find -L "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found (looked on PATH and in $ANDROID_HOME/build-tools)"
            exit 1
          fi
          cert=$("$apksigner_bin" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          expected=$(tr -d '[:space:]:' < .github/release-signing-sha256.txt | tr 'A-F' 'a-f')
          if [ "$cert" != "$expected" ]; then
            echo "::error::Release APK signed by $cert, expected $expected — check ANDROID_KEYSTORE_* secrets"
            exit 1
          fi
          echo "Release APK signing certificate matches the pinned digest."

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsloth-${{ matrix.type }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  # Publication is the final step: every artifact is built, verified and
  # staged before this job runs.
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/kmp-setup

      - name: Publish the release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published release matches the prepared version
        shell: bash
        run: |
          set -euo pipefail
          actual_version='${{ steps.semantic.outputs.new_release_version }}'
          actual_tag='${{ steps.semantic.outputs.new_release_git_tag }}'
          if [ "$actual_version" != '${{ needs.prepare.outputs.version }}' ] \
            || [ "$actual_tag" != '${{ needs.prepare.outputs.tag }}' ]; then
            echo "::error::Published $actual_tag ($actual_version), but the staged artifacts are for ${{ needs.prepare.outputs.tag }}"
            exit 1
          fi
          echo "PUBLISHED_TAG=$actual_tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$actual_version" >> "$GITHUB_ENV"

      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Stage release assets with checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK=$(find staging/subsloth-android -name '*.apk' 2>/dev/null | head -1)
          DEB=$(find staging/subsloth-desktop -name '*.deb' 2>/dev/null | head -1)
          WEB_DIR=staging/subsloth-web
          if [ -n "$APK" ]; then cp "$APK" "release-assets/subsloth-$VERSION-release.apk"; fi
          if [ -n "$DEB" ]; then cp "$DEB" "release-assets/subsloth-$VERSION-linux.deb"; fi
          if [ -d "$WEB_DIR" ]; then
            (cd "$WEB_DIR" && zip -qr "$GITHUB_WORKSPACE/release-assets/subsloth-$VERSION-web.zip" .)
          fi
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No staged artifacts found to publish"
            exit 1
          fi
          (cd release-assets && sha256sum ./* > SHA256SUMS)
          ls -l release-assets

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$PUBLISHED_TAG" release-assets/* --clobber

      # Never leave a published release with partial or missing assets: if
      # anything after publication fails, remove the release and its tag so
      # the next push can release the same commits again.
      - name: Delete a partial release on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.semantic.outputs.new_release_git_tag || needs.prepare.outputs.tag }}"
          if [ -n "$TAG" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Deleting partially published release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
