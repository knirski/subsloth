name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/kmp-setup

      - uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.display }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: 🟢 Android / APK
            type: android
            tasks: :androidApp:assembleDebug

          - display: 🖥️ Desktop / Linux
            type: desktop
            tasks: :desktopApp:packageDistributionForCurrentOS

          - display: 🌐 Web / wasmJs
            type: web
            tasks: :webApp:wasmJsBrowserProductionRunDistribute

          # macOS/iOS targets require macos-latest runner.
          # Uncomment when a macOS CI runner is configured:
          #
          # - display: 📱 iOS / Simulator Test
          #   type: ios
          #   os: macos-latest
          #   tasks: :core:model:iosSimulatorArm64Test
          #
          # - display: 🍏 macOS / Native Compile
          #   type: native
          #   os: macos-latest
          #   tasks: :core:model:compileKotlinMacosArm64

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/kmp-setup

      - run: ./gradlew ${{ matrix.tasks }}

      - name: Locate and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0 --match=v* 2>/dev/null || true)
          if [ -z "$TAG" ] || ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release tag found — skipping upload"
            exit 0
          fi

          case "${{ matrix.type }}" in
            android)
              find . -path '*/subsloth-*-debug.apk' -exec gh release upload "$TAG" {} --clobber \;
              ;;
            desktop)
              DEB=$(find . -path '*/compose/binaries/main/deb/*.deb' | head -1)
              if [ -n "$DEB" ]; then
                gh release upload "$TAG" "$DEB" --clobber
              fi
              ;;
            web)
              DIST="webApp/build/dist/wasmJs/productionExecutable"
              if [ -d "$DIST" ]; then
                cd "$DIST" && zip -r /tmp/subsloth-web.zip . && cd -
                gh release upload "$TAG" /tmp/subsloth-web.zip --clobber
              fi
              ;;
          esac
