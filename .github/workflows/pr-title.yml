name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

# Cancel redundant runs when pushing new commits to the same branch.
concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test|build|ci|perf|style)(\([a-z0-9._/-]+\))?(!)?:\ [^[:space:]].*$ ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected conventional-commit style, for example: docs: share agent instructions"
            exit 1
          fi
