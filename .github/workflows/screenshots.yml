name: Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >
          'verify' — compare against stored golden images (fails on UI drift).
          'update' — regenerate golden images, export to docs/screenshots/, and commit.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - update

concurrency:
  group: screenshots-${{ github.ref }}-${{ github.event.inputs.mode }}
  cancel-in-progress: true

# Manual trigger only — safe to grant write access; update mode pushes commits
# and re-dispatches CI for the new head.
permissions:
  contents: write
  actions: write

jobs:
  screenshots:
    name: ${{ github.event.inputs.mode == 'update' && '📸 Update' || '🔍 Verify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # update mode needs full history to stage golden changes
          fetch-depth: ${{ github.event.inputs.mode == 'update' && 0 || 1 }}

      - uses: ./.github/actions/kmp-setup

      # Cache Android virtual device and system images so they don't have
      # to be re-downloaded + re-created on every manual run (~1-2 min saving).
      - name: Cache AVD and system images
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/
            ~/.android/system-images/
          key: ${{ runner.os }}-avd-${{ runner.arch }}-api37.1-google_apis_ps16k
          restore-keys: |
            ${{ runner.os }}-avd-${{ runner.arch }}-

      - uses: ./.github/actions/kvm-setup

      - name: Run screenshot tests (verify mode)
        if: ${{ github.event.inputs.mode == 'verify' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.1'
          target: google_apis_ps16k
          arch: x86_64
          ram-size: 6144
          heap-size: 1024
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -cache-size 512
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew -Dorg.gradle.jvmargs="-Xmx3g" -Pkotlin.daemon.jvmargs="-Xmx512m" :androidApp:validateDebugScreenshotTest

      - name: Run screenshot tests (update mode) — regenerate goldens
        if: ${{ github.event.inputs.mode == 'update' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.1'
          target: google_apis_ps16k
          arch: x86_64
          ram-size: 6144
          heap-size: 1024
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -cache-size 512
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew -Dorg.gradle.jvmargs="-Xmx3g" -Pkotlin.daemon.jvmargs="-Xmx512m" :androidApp:updateDebugScreenshotTest

      # ── Update mode only: export + commit ──────────────────────────────
      # Reference images live at src/screenshotTestDebug/reference/ (the
      # path the compose-screenshot plugin writes for the debug variant).
      - name: Export reference images to docs/screenshots/
        if: ${{ github.event.inputs.mode == 'update' }}
        run: ./scripts/screenshots/export-readme-screenshots.sh

      - name: Commit golden and docs changes
        if: ${{ github.event.inputs.mode == 'update' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "subsloth-bot"
          git config user.email "bot@subsloth.net"

          git add \
            androidApp/src/screenshotTestDebug/reference/ \
            docs/screenshots/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          changed=$(git diff --cached --name-only)
          echo "Changes detected:"
          echo "$changed"

          git commit -m "chore: regenerate golden images and README screenshots"

          # Configure auth using GITHUB_TOKEN (persist-credentials: false above
          # means no token is stored — set it explicitly for push).
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease

      # A commit pushed with GITHUB_TOKEN does not run workflows: GitHub
      # parks the pull_request run in `action_required` until a human
      # approves it. Dispatching CI explicitly gives the new head a real
      # run (this covers the regolden commit, which is pushed by the bot).
      - name: Re-run CI for the updated branch
        if: ${{ github.event.inputs.mode == 'update' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}" -f skip_devshell_cache=true

      - name: Summarise
        run: |
          {
            echo "## Screenshot CI result"
            echo ""
            echo "- **Mode**: ${{ github.event.inputs.mode }}"
            echo "- **Trigger**: ${{ github.actor }}"
            echo "- **Ref**: ${{ github.ref }}"
          } >> "$GITHUB_STEP_SUMMARY"
