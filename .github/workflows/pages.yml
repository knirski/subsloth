name: Deploy Web to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/kmp-setup

      - name: Build web distribution with mock data
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsloth-web-${{ github.sha }}
          path: webApp/build/dist/wasmJs/productionExecutable
