name: Deploy Web to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kmp-setup

      - name: Build web distribution with mock data
        run: ./gradlew :webApp:wasmJsBrowserProductionRunDistribute

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
