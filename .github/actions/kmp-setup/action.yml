name: "KMP Gradle Setup"
description: "Set up JDK 25 (daemon) + JDK 17 (toolchain) + Gradle for KMP builds"
runs:
  using: "composite"
  steps:
    - name: Set up JDK 25 (Gradle daemon)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"

    - name: Set up JDK 17 (compile toolchain)
      id: jdk17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set environment JDK variables
      shell: bash
      run: |
        echo "JAVA17_HOME=${{ steps.jdk17.outputs.path }}" >> "$GITHUB_ENV"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        gradle-home-cache-cleanup: true
