name: "KMP Gradle Setup"
description: "Set up JDK 17 + Gradle + Kotlin/Native cache for KMP builds"
runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    # Kotlin/Native compiler cache — slow to download on every run (~5 min).
    # Keyed on Kotlin version only, so dependency bumps and build script
    # changes don't trigger a redownload. Extracted from the version catalog.
    - name: Get Kotlin version
      id: kotlin-version
      shell: bash
      run: |
        set -euo pipefail
        KOTLIN_VER=$(awk -F'"' '/^[[:space:]]*kotlin[[:space:]]*=[[:space:]]*"/ {print $2; exit}' gradle/libs.versions.toml)
        if [[ -z "${KOTLIN_VER}" ]]; then
          echo "Failed to parse Kotlin version from gradle/libs.versions.toml" >&2
          exit 1
        fi
        echo "version=${KOTLIN_VER}" >> "$GITHUB_OUTPUT"

    - name: Cache Kotlin/Native compiler
      uses: actions/cache@v5
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-konan-${{ steps.kotlin-version.outputs.version }}

    # Node.js distribution + npm package cache for KMP wasmJs targets.
    # Kotlin's wasmJs plugin downloads Node.js to ~/.gradle/nodejs/ and runs
    # npm install for dependencies declared with `npm(...)`. Without this
    # cache both steps are re-done from scratch on every CI run.
    # Key includes runner.arch (Node binary is arch-specific), Kotlin version
    # (Node version bundled with the plugin), and a hash of Gradle build
    # files (npm dependencies are declared in build.gradle.kts). Restore-keys
    # fallback preserves the Node.js distribution across dependency changes.
    - name: Cache Node.js and npm for wasmJs
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/nodejs
          ~/.npm
        key: ${{ runner.os }}-${{ runner.arch }}-wasm-${{ steps.kotlin-version.outputs.version }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-wasm-${{ steps.kotlin-version.outputs.version }}-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-cleanup: always
