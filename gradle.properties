org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# Isolated projects — reduces configuration contention and improves
# parallel task execution across modules. Stable since Gradle 8.1.
org.gradle.isolated-projects=true

# Kotlin daemon JVM args — avoid GC pressure during compilation.
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# JDK 17 toolchain (used by `kotlin { jvmToolchain(17) }`) is discovered via
# the JAVA17_HOME env var set by the Nix dev shell. See docs/jdk.md.
org.gradle.java.installations.fromEnv=JAVA17_HOME
