<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubSloth</title>
  <style>
    /* Compose must own the viewport: the default body margin and a
       content-sized document leave the player surface (and the interop
       <video> behind it) smaller than the screen when the browser enters
       fullscreen. */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Root background only: the player's interop <video> wrapper sits at
       z-index -1, so a body background would paint over the video. */
    html {
      background-color: black;
    }
  </style>
</head>
<body>
  <script src="./subsloth-web.js"></script>
</body>
</html>
